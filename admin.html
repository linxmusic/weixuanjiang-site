<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>预约管理 · 学生微宣讲团</title>
<style>
@font-face{font-family:'LXGW';src:url('assets/fonts/lxgw-subset.woff2') format('woff2');font-display:swap}
:root{
  --bg:#F8FAF7; --ink:#2A0F14; --muted:#6E6A66; --line:rgba(42,15,20,.10);
  --mark:#FFE45C; --accent:#D6303F; --card:#FFFFFF;
  --sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:
    repeating-linear-gradient(90deg,rgba(42,15,20,.03) 0 1px,transparent 1px 108px),
    repeating-linear-gradient(0deg,rgba(42,15,20,.03) 0 1px,transparent 1px 108px);
  background-position:74px -12px;
}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

.nav{display:flex;align-items:center;gap:14px;padding:22px 0}
.nav img{width:26px;height:26px}
.nav b{font-size:16px;font-weight:700}
.nav .tag{font-size:11px;background:var(--ink);color:#fff;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.nav .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.nav .r a{font-size:13px;text-decoration:none;color:var(--muted)}
.nav .r a:hover{color:var(--ink)}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:8px 0 22px;border-bottom:2px solid var(--ink)}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
.head p{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.head .btns{display:flex;gap:10px}
.btn{border:1px solid rgba(42,15,20,.16);background:#fff;border-radius:10px;padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn:hover{border-color:rgba(42,15,20,.4)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;transition:box-shadow .2s,transform .2s}
.stat:hover{transform:translateY(-1px);box-shadow:0 8px 20px -14px rgba(42,15,20,.6)}
.stat.on{border-color:var(--ink);box-shadow:0 0 0 2px rgba(255,228,92,.8) inset}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}

.head p.subnote{font-size:11px;color:#9A8F88;margin-top:3px}

/* 日历台账 */
.calbox{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px}
.calhd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.calhd b{font-size:16px;letter-spacing:-.01em;margin-right:auto}
.calbtn{border:1px solid rgba(42,15,20,.14);background:#fff;border-radius:8px;height:30px;min-width:30px;padding:0 8px;
  font-size:15px;line-height:1;cursor:pointer;color:var(--ink);font-family:inherit}
.calbtn:hover{border-color:rgba(42,15,20,.4)}
.caltoday{font-size:12px}
.calclear{font-size:12px;color:var(--accent);cursor:pointer;margin-left:4px}
.calclear:empty{display:none}
.calweek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.calweek span{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.06em}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calday{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:#FDFDFB;
  cursor:pointer;position:relative;transition:border-color .2s,background .2s}
.calday:hover{border-color:rgba(42,15,20,.3)}
.calday.empty{background:transparent;border-color:transparent;cursor:default}
.calday .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.calday.today .d{color:var(--accent);font-weight:700}
.calday.has{background:#FFFDF4}
.calday.on{border-color:var(--ink);box-shadow:0 0 0 2px rgba(255,228,92,.7) inset}
.calday .cnt{position:absolute;right:7px;top:6px;font-size:11px;font-weight:700;color:var(--ink)}
.calday .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:7px}
.calday .dot{width:6px;height:6px;border-radius:50%}
.calday .lbl{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 访问码 */
.gate{position:fixed;inset:0;z-index:300;background:rgba(248,250,247,.97);display:flex;align-items:center;justify-content:center;padding:24px}
.gate.off{display:none}
.gatebox{width:100%;max-width:330px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 26px;
  text-align:center;box-shadow:0 30px 60px -40px rgba(42,15,20,.5)}
.gatebox img{width:40px;height:40px}
.gatebox h2{font-size:19px;margin-top:10px;letter-spacing:-.01em}
.gatebox p{font-size:12px;color:var(--muted);margin-top:6px}
.gatebox input{width:100%;margin-top:18px;border:1px solid rgba(42,15,20,.18);border-radius:10px;padding:12px;
  font-size:16px;text-align:center;letter-spacing:.2em;font-family:inherit;background:#FDFDFB;color:var(--ink)}
.gatebox input:focus{outline:2px solid rgba(255,228,92,.9);outline-offset:1px}
.gatebox button{width:100%;margin-top:12px;border:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px;
  font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.gateerr{font-size:12px;color:var(--accent);margin-top:10px;min-height:16px}

@media (max-width:900px){
  .calbox{padding:13px}
  .calday{min-height:56px;padding:4px 5px}
  .calday .lbl{display:none}
  .calday .cnt{font-size:10px;right:5px;top:4px}
}

.bar{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.bar input[type=search]{flex:1;max-width:280px;border:1px solid rgba(42,15,20,.16);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff}
.bar select{border:1px solid rgba(42,15,20,.16);border-radius:9px;padding:9px 10px;font-size:13px;font-family:inherit;background:#fff}
.bar .cnt{margin-left:auto;font-size:12px;color:var(--muted)}

.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{padding:16px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item .no{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.item .st{font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.item .org{font-size:15px;font-weight:700;margin-top:8px;letter-spacing:-.01em}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.75}
.item .meta b{color:var(--ink);font-weight:600}
.item .acts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.item .acts button{font-size:12px;padding:7px 12px;border-radius:8px;border:1px solid rgba(42,15,20,.16);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.item .acts button:hover{border-color:rgba(42,15,20,.45)}
.item .acts .primary{background:var(--mark);border-color:rgba(42,15,20,.2);font-weight:600}
.item .acts .danger{color:var(--accent);border-color:rgba(214,48,63,.3)}
.item .acts .danger:hover{background:#FEF3F2}
.item .note{margin-top:9px;font-size:12px;background:#FBF7E6;border-radius:8px;padding:8px 10px;color:#7A5A12}
.item .note.reject{background:#FDF0EF;color:#8A2620}

/* 活动 / 比赛事件 */
.evsec{margin-top:26px}
.evsec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.evsec-hd b{font-size:14px}
.evsec-hd span{font-size:12px;color:var(--muted)}
.evlist{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.evitem{padding:14px 18px;border-bottom:1px solid var(--line)}
.evitem:last-child{border-bottom:0}
.evitem .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.evkind{font-size:11px;padding:3px 9px;border-radius:999px;background:#F1ECFA;color:#6B4E9E;white-space:nowrap}
.evitem .ttl{font-size:15px;font-weight:700;letter-spacing:-.01em}
.evitem .when{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.evitem .meta{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7}
.evitem .acts{display:flex;gap:8px;margin-top:9px}
.evitem .acts button{font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid rgba(42,15,20,.16);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.evitem .acts .danger{color:var(--accent);border-color:rgba(214,48,63,.3)}
.calday .dot.ev{background:#7A5C9E}

.modal{position:fixed;inset:0;z-index:400;background:rgba(20,12,14,.42);display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modalbox{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:24px}
.modalbox h3{font-size:18px;letter-spacing:-.01em}
.modalbox .mfield{margin-top:13px}
.modalbox label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.modalbox input,.modalbox select,.modalbox textarea{width:100%;border:1px solid rgba(42,15,20,.18);border-radius:9px;padding:10px;font-size:14px;font-family:inherit;background:#FDFDFB}
.modalbox textarea{min-height:58px;resize:vertical}
.modalbox .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modalbox .macts{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
.modalbox .macts button{padding:10px 16px;border-radius:9px;border:1px solid rgba(42,15,20,.18);background:#fff;font-family:inherit;font-size:13.5px;cursor:pointer}
.modalbox .macts .primary{background:var(--mark);border-color:rgba(42,15,20,.2);font-weight:600}
@media (max-width:640px){.modalbox .two{grid-template-columns:1fr}}

.empty{text-align:center;padding:56px 20px;color:var(--muted);font-size:13.5px;line-height:2}
.empty .btn{margin-top:8px}

.foot{display:flex;justify-content:space-between;padding:26px 0 44px;font-size:11px;color:var(--muted)}

@media (max-width:900px){
  .wrap{padding:0 18px}
  .nav{padding:16px 0}
  .nav .tag{display:none}
  .head{flex-direction:column;align-items:flex-start;gap:14px;padding-bottom:18px}
  .head h1{font-size:23px}
  .head .btns{width:100%}
  .head .btns .btn{flex:1;text-align:center}
  .stats{grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}

  .stat b{font-size:19px}
  .bar{flex-wrap:wrap;margin-top:18px}
  .bar input[type=search]{max-width:none;flex:1 1 100%}
  .bar .cnt{margin-left:0;width:100%}
  .item{padding:14px}
  .item .org{font-size:14px}
  .item .acts button{flex:1}
  .foot{flex-direction:column;align-items:flex-start;gap:6px;line-height:1.7}
}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gatebox">
    <img src="assets/img/logo-mark.png" alt="">
    <h2>预约管理</h2>
    <p>请输入访问码</p>
    <input id="gateInput" type="password" inputmode="numeric" placeholder="访问码" autocomplete="off">
    <button id="gateBtn" type="button">进入</button>
    <div class="gateerr" id="gateErr"></div>
  </div>
</div>
<div class="wrap">

  <nav class="nav">
    <img src="assets/img/logo-mark.png" alt="">
    <b>学生微宣讲团</b>
    <span class="tag">预约管理</span>
    <div class="r"><a href="index.html">返回首页</a></div>
  </nav>

  <div class="head">
    <div>
      <h1 id="hTitle">全部预约</h1>
      <p>受理、派讲师、确认；活动与比赛也可以手动记进日历。</p>
      <p class="subnote">当前为演示版：数据只保存在这台设备的浏览器里，接后端后多端共用。</p>
    </div>
    <div class="btns">
      <button class="btn" id="btnAddEvent">添加事件</button>
      <button class="btn" id="btnCsv">导出 CSV</button>
      <button class="btn dark" id="btnRefresh">刷新</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="calbox">
    <div class="calhd">
      <b id="calTitle">—</b>
      <button class="calbtn" id="calPrev" aria-label="上个月">‹</button>
      <button class="calbtn" id="calNext" aria-label="下个月">›</button>
      <button class="calbtn caltoday" id="calToday">今天</button>
      <span class="calclear" id="calClear"></span>
    </div>
    <div class="calweek"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
    <div class="calgrid" id="calGrid"></div>
  </div>

  <div class="evsec">
    <div class="evsec-hd"><b>活动 / 比赛</b><span id="evCount"></span></div>
    <div class="evlist" id="evList"></div>
  </div>

  <div class="bar">
    <input type="search" id="q" placeholder="搜单位、联系人、单号…">
    <select id="sort">
      <option value="new">按提交时间（新→旧）</option>
      <option value="time">按宣讲时间（近→远）</option>
    </select>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="list" id="list"></div>

  <footer class="foot"><span>西安交通大学学生微宣讲团 · 预约管理</span><span>2017 — 2026</span></footer>
</div>

<div class="modal" id="evModal" role="dialog" aria-modal="true" aria-labelledby="evModalTitle">
  <div class="modalbox">
    <h3 id="evModalTitle">添加事件</h3>
    <input type="hidden" id="evId">
    <div class="mfield"><label>类型</label>
      <select id="evKind"><option>活动</option><option>比赛</option><option>培训</option></select>
    </div>
    <div class="mfield"><label>名称 *</label>
      <input id="evTitleIn" placeholder="例：第十三期「筑言计划」第一期理论培训">
    </div>
    <div class="mfield two">
      <div><label>日期 *</label><input id="evDate" type="date"></div>
      <div><label>开始时间</label><input id="evTime" type="time" value="14:00"></div>
    </div>
    <div class="mfield two">
      <div><label>结束时间</label><input id="evTime2" type="time" value="15:00"></div>
      <div><label>参与人数</label><input id="evPeople" inputmode="numeric" placeholder="选填"></div>
    </div>
    <div class="mfield"><label>地点</label>
      <input id="evPlace" placeholder="例：兴庆校区主楼 B 座 204">
    </div>
    <div class="mfield"><label>主办 / 单位</label>
      <input id="evOrg" placeholder="例：学生微宣讲团">
    </div>
    <div class="mfield"><label>宣讲人</label>
      <input id="evSpeaker" placeholder="选填，多人用顿号隔开">
    </div>
    <div class="mfield"><label>备注</label>
      <textarea id="evNote" placeholder="选填"></textarea>
    </div>
    <div class="macts">
      <button type="button" id="evCancel">取消</button>
      <button type="button" class="primary" id="evSave">保存</button>
    </div>
  </div>
</div>

<script>
const KEY = 'xyyj_bookings_v1';
const EVKEY = 'xyyj_events_v1';
const FLOW = ['待受理','已受理','待讲师确认','已确认','已完成','已退回'];
const COLOR = {
  '待受理':   ['#9A6B12','#FBF1DC'],
  '已受理':   ['#3F628F','#EAF1FB'],
  '待讲师确认':['#8A5B12','#FDF3E2'],
  '已确认':   ['#2F6047','#E7F1EA'],
  '已完成':   ['#5E5A51','#EEEAE0'],
  '已退回':   ['#A3312A','#F8E6E4']
};

let MEM = [];
let LS = null;
try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); LS = localStorage; } catch(e){ LS = null; }
const load = () => {
  if(LS){ try { const v = JSON.parse(LS.getItem(KEY)); if(Array.isArray(v)) return v; } catch(e){} }
  return MEM.slice();
};
const save = list => { MEM = list.slice(); if(LS){ try { LS.setItem(KEY, JSON.stringify(list)); } catch(e){} } };

let EVMEM = [];
const loadEvents = () => {
  if(LS){ try { const v = JSON.parse(LS.getItem(EVKEY)); if(Array.isArray(v)) return v; } catch(e){} }
  return EVMEM.slice();
};
const saveEvents = list => { EVMEM = list.slice(); if(LS){ try { LS.setItem(EVKEY, JSON.stringify(list)); } catch(e){} } };

let filter = '全部';
let keyword = '';
let sortBy = 'new';
let dayFilter = '';
let calY = new Date().getFullYear();
let calM = new Date().getMonth();

const $ = id => document.getElementById(id);

function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||'');
  return m ? `${m[1]} 年 ${+m[2]} 月 ${+m[3]} 日` : (iso||'');
}
function fmtCreated(s){
  if(!s) return '—';
  const d = new Date(s);
  if(isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderStats(all){
  const box = $('stats');
  const items = [['全部', all.length]].concat(FLOW.map(s => [s, all.filter(x => x.status === s).length]));
  box.innerHTML = items.map(([name, n]) =>
    `<div class="stat ${filter === name ? 'on' : ''}" data-f="${name}"><b>${n}</b><span>${name}</span></div>`
  ).join('');
  box.querySelectorAll('.stat').forEach(el => el.addEventListener('click', () => {
    filter = el.dataset.f;
    $('hTitle').textContent = filter === '全部' ? '全部预约' : filter;
    render();
  }));
}

function visible(all){
  let out = all.slice();
  if(filter !== '全部') out = out.filter(x => x.status === filter);
  if(dayFilter) out = out.filter(x => x.date === dayFilter);
  if(keyword){
    const k = keyword.toLowerCase();
    out = out.filter(x => [x.no,x.org,x.name,x.topic,x.phone,x.place,x.speaker].join(' ').toLowerCase().includes(k));
  }
  out.sort((a,b) => sortBy === 'time'
    ? (a.date + a.time).localeCompare(b.date + b.time)
    : String(b.created||'').localeCompare(String(a.created||'')));
  return out;
}

function renderCal(all, events){
  const map = {};
  all.forEach(r => {
    if(/^\d{4}-\d{2}-\d{2}$/.test(r.date || '')) (map[r.date] = map[r.date] || []).push({kind:'book', ...r});
  });
  (events || []).forEach(e => {
    if(/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) (map[e.date] = map[e.date] || []).push({kind:'event', ...e});
  });

  $('calTitle').textContent = `${calY} 年 ${calM + 1} 月`;
  const first = new Date(calY, calM, 1);
  const start = (first.getDay() + 6) % 7;              // 周一为一周第一天
  const days = new Date(calY, calM + 1, 0).getDate();
  const t = new Date();
  const todayStr = `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;

  let html = '';
  for(let i = 0; i < start; i++) html += '<div class="calday empty"></div>';
  for(let d = 1; d <= days; d++){
    const ds = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const recs = map[ds] || [];
    const cls = ['calday'];
    if(recs.length) cls.push('has');
    if(ds === todayStr) cls.push('today');
    if(ds === dayFilter) cls.push('on');
    const dots = recs.slice(0, 5).map(r => {
      if(r.kind === 'event') return `<span class="dot ev"></span>`;
      const c = (COLOR[r.status] || ['#999'])[0];
      return `<span class="dot" style="background:${c}"></span>`;
    }).join('');
    const first = recs[0];
    const lbl = recs.length ? esc(first.kind === 'event' ? first.title : first.org) + (recs.length > 1 ? ` +${recs.length - 1}` : '') : '';
    const nb = recs.filter(x => x.kind === 'book').length;
    const ne = recs.length - nb;
    const tip = [nb ? nb + ' 条预约' : '', ne ? ne + ' 个活动' : ''].filter(Boolean).join(' · ');
    html += `<div class="${cls.join(' ')}" data-date="${ds}" title="${tip}">
      <span class="d">${d}</span>
      ${recs.length ? `<span class="cnt">${recs.length}</span><div class="dots">${dots}</div><div class="lbl">${lbl}</div>` : ''}
    </div>`;
  }
  $('calGrid').innerHTML = html;

  $('calGrid').querySelectorAll('[data-date]').forEach(el => {
    el.addEventListener('click', () => {
      const ds = el.dataset.date;
      dayFilter = dayFilter === ds ? '' : ds;
      render();
    });
  });
  $('calClear').textContent = dayFilter ? '显示全部' : '';
}

function renderEvents(events){
  const box = $('evList');
  if(!box) return;
  let rows = events.slice();
  if(dayFilter) rows = rows.filter(x => x.date === dayFilter);
  if(keyword){
    const k = keyword.toLowerCase();
    rows = rows.filter(x => [x.title,x.org,x.place,x.speaker].join(' ').toLowerCase().includes(k));
  }
  rows.sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')));
  $('evCount').textContent = rows.length ? `共 ${rows.length} 个` : '';
  if(!rows.length){
    box.innerHTML = `<div class="empty" style="padding:26px 18px">${events.length ? '这一天没有活动或比赛。' : '还没有添加活动或比赛。点右上角「添加事件」。'}</div>`;
    return;
  }
  box.innerHTML = rows.map(e => `<div class="evitem" data-id="${esc(e.id)}">
    <div class="row1">
      <span class="evkind">${esc(e.kind || '活动')}</span>
      <span class="ttl">${esc(e.title)}</span>
      <span class="when">${fmtDate(e.date)}${e.time ? ' ' + esc(e.time) + (e.time2 ? '–' + esc(e.time2) : '') : ''}</span>
    </div>
    <div class="meta">
      ${[e.place, e.org, e.people ? e.people + ' 人' : '', e.speaker ? '宣讲人：' + e.speaker : ''].filter(Boolean).map(esc).join(' · ')}
      ${e.note ? `<br>备注：${esc(e.note)}` : ''}
    </div>
    <div class="acts">
      <button data-edit="${esc(e.id)}">编辑</button>
      <button class="danger" data-del="${esc(e.id)}">删除</button>
    </div>
  </div>`).join('');

  box.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEvent(b.dataset.edit)));
  box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    if(!confirm('删除这个事件？')) return;
    saveEvents(loadEvents().filter(x => x.id !== b.dataset.del));
    render();
  }));
}

function render(){
  const all = load();
  const events = loadEvents();
  renderStats(all);
  renderCal(all, events);
  renderEvents(events);
  const rows = visible(all);
  $('cnt').textContent = `共 ${rows.length} 条`;
  const box = $('list');

  if(!all.length){
    box.innerHTML = `<div class="empty">
      还没有收到预约。<br>
      有人在首页提交之后，这里就会出现。
      <div><button class="btn" id="seed">生成三条演示数据</button></div>
      <div style="font-size:11px;margin-top:6px">只写在本机，不会上传</div>
    </div>`;
    const s = $('seed');
    if(s) s.addEventListener('click', seedDemo);
    return;
  }
  if(!rows.length){
    box.innerHTML = `<div class="empty">没有符合条件的预约。</div>`;
    return;
  }

  box.innerHTML = rows.map(r => {
    const [c, bg] = COLOR[r.status] || ['#555','#eee'];
    const acts = [];
    if(r.status === '待受理'){
      acts.push(`<button class="primary" data-act="已受理" data-no="${r.no}">受理</button>`);
      acts.push(`<button class="danger" data-act="已退回" data-no="${r.no}">退回</button>`);
    } else if(r.status === '已受理'){
      acts.push(`<button class="primary" data-act="待讲师确认" data-no="${r.no}">提交讲师确认</button>`);
      acts.push(`<button class="danger" data-act="已退回" data-no="${r.no}">退回</button>`);
    } else if(r.status === '待讲师确认'){
      acts.push(`<button class="primary" data-act="已确认" data-no="${r.no}">讲师已确认</button>`);
      acts.push(`<button class="danger" data-act="已退回" data-no="${r.no}">退回</button>`);
    } else if(r.status === '已确认'){
      acts.push(`<button class="primary" data-act="已完成" data-no="${r.no}">标记已完成</button>`);
      acts.push(`<button class="danger" data-act="已退回" data-no="${r.no}">退回</button>`);
    } else if(r.status === '已退回'){
      acts.push(`<button data-act="待受理" data-no="${r.no}">重新受理</button>`);
    }
    return `<div class="item">
      <div class="row1">
        <span class="no">${r.no}</span>
        <span class="st" style="color:${c};background:${bg}">${r.status}</span>
        <span class="no" style="margin-left:auto">提交于 ${fmtCreated(r.created)}</span>
      </div>
      <div class="org">${esc(r.org)}</div>
      <div class="meta">
        ${esc(r.name)} · 手机 ${esc(r.tel || '—')} · 微信 <b>${esc(r.phone)}</b><br>
        ${fmtDate(r.date)} ${esc(r.time)}${r.time2 ? '–' + esc(r.time2) : ''} · ${r.audience ? esc(r.audience) + ' · ' : ''}${esc(r.people)} 人 · 讲师 ${esc(r.teachers || '—')}<br>
        时长：${esc(r.dur)} · ${esc(r.mode)}<br>
        ${r.speaker ? `指定宣讲人：${esc(r.speaker)}<br>` : ''}主题：${esc(r.topic)}<br>
        ${r.mode === '线上' ? '会议：' : '地点：'}${esc(r.place)}
      </div>
      ${r.note ? `<div class="note">备注：${esc(r.note)}</div>` : ''}
      ${r.reject ? `<div class="note reject">退回原因：${esc(r.reject)}</div>` : ''}
      <div class="acts">${acts.join('')}</div>
    </div>`;
  }).join('');

  box.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const no = b.dataset.no, act = b.dataset.act;
    const list = load();
    const rec = list.find(x => x.no === no);
    if(!rec) return;
    if(act === '已退回'){
      const why = prompt('退回原因（会显示在记录里，也会写给你自己看）：', '时间冲突，请另约');
      if(why === null) return;
      rec.reject = why.trim() || '未说明原因';
    } else {
      delete rec.reject;
    }
    rec.status = act;
    rec.updated = new Date().toISOString();
    save(list);
    render();
  }));
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('q').addEventListener('input', e => { keyword = e.target.value.trim(); render(); });
$('sort').addEventListener('change', e => { sortBy = e.target.value; render(); });
$('btnRefresh').addEventListener('click', render);

$('btnCsv').addEventListener('click', () => {
  const rows = visible(load());
  if(!rows.length){ alert('没有可导出的记录'); return; }
  const head = ['单号','状态','提交时间','所在集体','姓名','手机号码','微信号','宣讲对象','人数','日期','开始时间','结束时间','讲师人数','时长','形式','地点','指定宣讲人','主题','备注','退回原因'];
  const body = rows.map(r => [r.no,r.status,fmtCreated(r.created),r.org,r.name,r.tel||'',r.phone,r.audience||'',r.people,r.date,r.time,r.time2||'',r.teachers||'',r.dur,r.mode,r.place,r.speaker||'',r.topic,r.note||'',r.reject||'']);
  const csv = '﻿' + [head].concat(body)
    .map(line => line.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `学生微宣讲团-预约-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
});

/* 演示数据：只在本地，标清楚 */

  if(load().length){ alert('已经有记录了，不再生成'); return; }
  const d = new Date();
  const day = n => { const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };

  });
  save([

    mk('XY20261103-001','南洋书院团委','张同学','13900002222','西迁精神',day(9),'15:00','60','45–60 分钟','线上','腾讯会议 123-456-789','已受理'),
    mk('XY20261102-001','能动 2401 团支部','王同学','13700003333','请宣讲团推荐',day(-2),'16:30','45','30 分钟左右','线下','创新港 5 号楼 208','已完成')
  ]);

}

/* 活动 / 比赛事件：新增、编辑 */
function openEvent(id){
  const ev = id ? loadEvents().find(x => x.id === id) : null;
  $('evModalTitle').textContent = ev ? '编辑事件' : '添加事件';
  $('evId').value = ev ? ev.id : '';
  $('evKind').value = ev ? (ev.kind || '活动') : '活动';
  $('evTitleIn').value = ev ? ev.title : '';
  $('evDate').value = ev ? ev.date : new Date().toISOString().slice(0,10);
  $('evTime').value = ev ? (ev.time || '14:00') : '14:00';
  $('evTime2').value = ev ? (ev.time2 || '15:00') : '15:00';
  $('evPeople').value = ev ? (ev.people || '') : '';
  $('evPlace').value = ev ? (ev.place || '') : '';
  $('evOrg').value = ev ? (ev.org || '') : '';
  $('evSpeaker').value = ev ? (ev.speaker || '') : '';
  $('evNote').value = ev ? (ev.note || '') : '';
  $('evModal').classList.add('on');
  setTimeout(() => $('evTitleIn').focus(), 60);
}
function closeEvent(){ $('evModal').classList.remove('on'); }

$('btnAddEvent').addEventListener('click', () => openEvent(''));
$('evCancel').addEventListener('click', closeEvent);
$('evModal').addEventListener('click', e => { if(e.target === $('evModal')) closeEvent(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('evModal').classList.contains('on')) closeEvent(); });

$('evSave').addEventListener('click', () => {
  const title = $('evTitleIn').value.trim();
  const date = $('evDate').value;
  if(!title){ alert('请填写事件名称'); $('evTitleIn').focus(); return; }
  if(!date){ alert('请选择日期'); $('evDate').focus(); return; }
  const t1 = $('evTime').value, t2 = $('evTime2').value;
  if(t1 && t2 && t2 <= t1){ alert('结束时间要晚于开始时间'); return; }
  const rec = {
    id: $('evId').value || ('EV' + Date.now()),
    kind: $('evKind').value,
    title, date, time: t1, time2: t2,
    people: $('evPeople').value.trim(),
    place: $('evPlace').value.trim(),
    org: $('evOrg').value.trim(),
    speaker: $('evSpeaker').value.trim(),
    note: $('evNote').value.trim(),
    created: new Date().toISOString()
  };
  const list = loadEvents();
  const i = list.findIndex(x => x.id === rec.id);
  if(i >= 0) list[i] = Object.assign({}, list[i], rec);
  else list.push(rec);
  saveEvents(list);
  const [y,m] = date.split('-').map(Number);
  calY = y; calM = m - 1; dayFilter = '';
  closeEvent();
  render();
});

/* 日历翻页与清除 */
$('calPrev').addEventListener('click', () => {
  calM--; if(calM < 0){ calM = 11; calY--; }
  render();
});
$('calNext').addEventListener('click', () => {
  calM++; if(calM > 11){ calM = 0; calY++; }
  render();
});
$('calToday').addEventListener('click', () => {
  const d = new Date();
  calY = d.getFullYear(); calM = d.getMonth();
  dayFilter = `${calY}-${String(calM+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  render();
});
$('calClear').addEventListener('click', () => { if(dayFilter){ dayFilter = ''; render(); } });

/* 访问码：只挡一下，不是真安全 */
const GATE_KEY = 'xyyj_admin_ok';
const ACCESS_CODE = '8888';
function unlockAdmin(){
  const g = $('gate');
  if(g) g.classList.add('off');
  document.body.style.overflow = '';
}
try {
  if(sessionStorage.getItem(GATE_KEY) === '1') unlockAdmin();
  else document.body.style.overflow = 'hidden';
} catch(e){ document.body.style.overflow = 'hidden'; }
$('gateBtn').addEventListener('click', () => {
  const v = $('gateInput').value.trim();

    $('gateInput').select();
  }

$('gateInput').addEventListener('keydown', e => { if(e.key === 'Enter') $('gateBtn').click(); });

render();
</script>
