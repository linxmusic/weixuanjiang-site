<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>分团介绍 · 学生微宣讲团</title>
<style>
@font-face{font-family:'LXGW';src:url('assets/fonts/lxgw-subset.woff2') format('woff2');font-display:swap}
:root{
  --bg:#F8FAF7; --ink:#2A0F14; --muted:#6E6A66; --line:rgba(42,15,20,.12);
  --accent:#C0273A; --seal:#9E1B22; --mark:#FFE45C;
  --sans:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:'LXGW',"Source Han Serif SC","Songti SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(60% 46% at 78% 0%, rgba(192,39,58,.045), rgba(192,39,58,0) 70%),
    radial-gradient(52% 40% at 10% 40%, rgba(42,15,20,.035), rgba(42,15,20,0) 72%);
  background-attachment:fixed;
}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 32px}

.top{display:flex;align-items:center;gap:12px;padding:22px 0;border-bottom:1px solid var(--line)}
.top img{width:28px;height:28px}
.top b{font-size:15px;letter-spacing:-.01em}
.top .back{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:none}
.top .back:hover{color:var(--ink)}

.hero{padding:52px 0 34px;display:grid;grid-template-columns:1fr 210px;gap:48px;align-items:start}
.kicker{font-size:12px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--serif);font-size:44px;line-height:1.22;font-weight:400;letter-spacing:.06em;margin-top:16px}
.lede{margin-top:20px;font-size:15px;line-height:1.95;color:var(--muted);max-width:36em}
.stats{display:flex;gap:44px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.stats b{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.06em}

.sealbox{padding-top:8px;display:flex;flex-direction:column;align-items:center;gap:16px}
.seal{width:148px;height:148px;border:3px solid var(--c,#9E1B22);border-radius:6px;color:var(--c,#9E1B22);
  display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--serif);
  font-size:26px;line-height:1.45;letter-spacing:.12em;transform:rotate(-4deg);background:rgba(255,255,255,.45)}
.seal em{font-style:normal}
.sealnote{font-size:11px;color:var(--muted);letter-spacing:.12em}

.sec{padding:34px 0;border-top:1px solid var(--line)}
.sec h2{font-size:13px;letter-spacing:.16em;font-weight:700;color:var(--muted);margin-bottom:20px}
.sec p{font-family:var(--serif);font-size:15.5px;line-height:2.05;color:#3A2F2C;margin-bottom:16px;text-align:justify}
.dirs{display:flex;flex-wrap:wrap;gap:12px}
.dir{border:1px solid var(--line);border-radius:4px;padding:9px 15px;font-size:13.5px;background:rgba(255,255,255,.6)}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.08em;
  padding:10px 12px;border-bottom:2px solid var(--ink);white-space:nowrap}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.7}
.tbl td.n{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.tbl td.tt{font-family:var(--serif);font-size:14px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(192,39,58,.35);white-space:nowrap}
.tbl td a:hover{border-bottom-color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);line-height:1.8;margin-top:14px}

.people{display:flex;flex-wrap:wrap;gap:10px}
.person{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;background:rgba(255,255,255,.7)}

.cta{margin-top:10px;padding:44px 0 54px;border-top:2px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:24px}
.cta h3{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:.05em}
.cta a{background:var(--ink);color:#fff;text-decoration:none;padding:14px 24px;border-radius:999px;font-size:14px}
.cta a:hover{opacity:.92}

.foot{display:flex;justify-content:space-between;padding:24px 0 40px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted)}

@media (max-width:800px){
  .wrap{padding:0 20px}
  .hero{grid-template-columns:1fr;gap:26px;padding:34px 0 22px}
  .sealbox{order:-1;flex-direction:row;justify-content:flex-start;gap:14px}
  .seal{width:78px;height:78px;font-size:15px;border-width:2px}
  h1{font-size:30px}
  .lede{font-size:13.5px}
  .stats{gap:26px}
  .stats b{font-size:21px}
  .sec p{font-size:14px}
  .tbl{display:block;white-space:normal}
  .tbl thead{display:none}
  .tbl tbody{display:block}
  .tbl tr{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
  .tbl td{display:block;border:0;padding:2px 0}
  .tbl td.n{font-size:11.5px}
  .tbl td:nth-child(2){font-size:12.5px;color:var(--muted);margin-top:2px}
  .tbl td:nth-child(3){font-size:12px;color:var(--muted);margin-top:4px}
  .tbl td.tt{font-size:14px;margin-top:3px}
  .tbl td.num{text-align:left;font-size:11.5px;color:var(--muted);margin-top:4px}
  .tbl tr.empty td:not(:first-child){display:none}
  .tbl tr.empty td.n::after{content:" · 该期月报未单列本分团";font-size:11px;color:var(--muted)}
  .cta{flex-direction:column;align-items:flex-start}
  .cta h3{font-size:24px}
  .foot{flex-direction:column;align-items:flex-start;gap:6px;line-height:1.7}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <img src="assets/img/logo-mark.png" alt="">
    <b>西安交通大学学生微宣讲团</b>
    <a class="back" href="index.html">← 回主站</a>
  </header>

  <main id="main"></main>
</div>

<script src="assets/site.js?v=20261105k"></script>
<script>
const BR = (window.SITE && window.SITE.branches) || [];
const qs = new URLSearchParams(location.search);
let idx = parseInt(qs.get('b'), 10);
if (!(idx >= 0 && idx < BR.length)) idx = 0;
const b = BR[idx] || null;

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const fmtN = n => String(n == null ? '' : n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

if (!b) {
  document.getElementById('main').innerHTML = '<p style="padding:60px 0;color:#6E6A66">没有找到这个分团。<a href="index.html">回主站</a></p>';
} else {
  document.title = b.name + ' · 学生微宣讲团';
  const rows = (b.ledger || []).map(r => `<tr>
      <td class="n">${esc(r.d)}</td>
      <td>${esc(r.where)}</td>
      <td>${esc(r.who)}</td>
      <td class="tt">${esc(r.title)}</td>
      <td class="num">${r.n} 人</td>
    </tr>`).join('');

  document.getElementById('main').innerHTML = `
  <section class="hero">
    <div>
      <div class="kicker">校内分团 · ${esc(b.org)}</div>
      <h1>${esc(b.name)}</h1>
      <p class="lede">${esc(b.bio)}</p>
      <div class="stats">
        <div><b>${fmtN(b.sessions)}</b><span>近一年月报宣讲场次</span></div>
        <div><b>${fmtN(b.people)}</b><span>覆盖人次</span></div>
        <div><b>${(b.members || []).length}</b><span>月报具名宣讲人</span></div>
      </div>
    </div>
    <div class="sealbox">
      <div class="seal" style="--c:${b.color}"><em>${esc(b.short).replace(' · ', '<br>')}</em></div>
      <div class="sealnote">学生微宣讲团 · 分团</div>
    </div>
  </section>

  ${(b.intro || []).length ? `<section class="sec">
    <h2>分团介绍</h2>
    ${b.intro.map(p => `<p>${esc(p)}</p>`).join('')}
  </section>` : ''}

  ${(b.directions || []).length ? `<section class="sec">
    <h2>宣讲方向</h2>
    <div class="dirs">${b.directions.map(d => `<span class="dir">${esc(d)}</span>`).join('')}</div>
  </section>` : ''}

  <section class="sec">
    <h2>月报数据 · 2025.09 — 2026.08</h2>
    <table class="tbl">
      <thead><tr><th>月份</th><th style="text-align:right">宣讲场次</th><th style="text-align:right">覆盖人次</th><th>月报</th></tr></thead>
      <tbody>${(b.monthly || []).map(r => `<tr class="${r.s || r.p ? '' : 'empty'}">
        <td class="n">${esc(r.m)}</td>
        <td class="num">${r.s ? r.s + ' 场' : '—'}</td>
        <td class="num">${r.p ? r.p + ' 人次' : '—'}</td>
        <td>${r.u ? `<a href="${esc(r.u)}" target="_blank" rel="noopener">查看原文 ›</a>` : '—'}</td>
      </tr>`).join('')}</tbody>
    </table>
    <p class="note">数据取自各期《学生宣讲工作月报》的「宣讲动态」统计表。场次按表中的宣讲场次行计（同一场合多人合讲记 1 场），人次按该场合填报人数计；「—」表示该期月报统计表未单列本分团，不代表当月没有宣讲。</p>
  </section>

  ${(b.ledger || []).length ? `<section class="sec">
    <h2>宣讲台账 · 2026 年 6–8 月（明细）</h2>
    <table class="tbl">
      <thead><tr><th>日期</th><th>宣讲场合</th><th>宣讲人</th><th>题目</th><th style="text-align:right">参与人数</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </section>` : ''}

  ${(b.members || []).length ? `<section class="sec">
    <h2>宣讲人</h2>
    <div class="people">${b.members.map(m => `<span class="person">${esc(m)}</span>`).join('')}</div>
  </section>` : ''}

  <section class="cta">
    <h3>约一场这样的宣讲</h3>
    <a href="index.html#topics">去主站预约 →</a>
  </section>

  <footer class="foot">
    <span>西安交通大学学生微宣讲团 · ${esc(b.name)}</span>
    <span>2017 — 2026</span>
  </footer>`;
}
</script>
</body>
</html>
